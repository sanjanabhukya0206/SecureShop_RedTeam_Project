{% extends "base.html" %}{% block content %}
<h2>Admin Area</h2>
<p>Hardened version: passwords are never displayed.</p>
<table><tr><th>ID</th><th>Username</th><th>Role</th><th>Action</th></tr>
{% for u in users %}<tr><td>{{u.id}}</td><td>{{u.username}}</td><td>{{u.role}}</td><td>{% if u.id != session.user_id %}<form method="post" action="{{url_for('delete_user', user_id=u.id)}}"><button type="submit">Delete</button></form>{% else %}Current user{% endif %}</td></tr>{% endfor %}</table>
{% endblock %}
